name: Sync Entregadores

on:
  schedule:
    # A cada 30 min. Pedido do usuário 05/08/2026 -- frequência maior que
    # 1x/dia pra pegar aprovações recentes rápido (ex.: CPF avulso no painel
    # que ainda não tinha ifood_id). Cuidado: esse robô faz login no mesmo
    # franqueado.entregolog.com usado por d1_sync e agendamento_watcher --
    # se o Akamai (WAF) começar a bloquear por excesso de logins, é aqui
    # que se deve reduzir a frequência de novo.
    - cron: '4,34 * * * *'  # minutos 4 e 34, fora da hora cheia (menos fila no Actions)
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r robots/requirements.txt
          playwright install --with-deps chromium

      - name: Sincronizar roster de Entregadores (SAO PAULO) no Supabase
        env:
          SISTEMA_EMAIL: ${{ secrets.SISTEMA_EMAIL }}
          SISTEMA_PASSWORD: ${{ secrets.SISTEMA_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python robots/entregadores_sync.py

      - name: Salvar screenshot de erro (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-entregadores-sync
          path: robots/debug_entregadores_sync.png
          if-no-files-found: ignore
