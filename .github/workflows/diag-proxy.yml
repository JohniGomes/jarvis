name: Diagnóstico de proxy

on:
  workflow_dispatch: {}

jobs:
  testar:
    runs-on: ubuntu-latest
    steps:
      - name: Testar conexão direta com o proxy (sem Playwright)
        env:
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: |
          echo "Testando 5x seguidas, com tempo entre cada uma..."
          for i in 1 2 3 4 5; do
            echo "--- Tentativa $i ---"
            time curl -s -m 15 -x "http://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_SERVER#http://}" \
              -w "\nHTTP_CODE:%{http_code} TEMPO_TOTAL:%{time_total}s\n" \
              https://api.ipify.org?format=json || echo "FALHOU tentativa $i"
            sleep 3
          done
