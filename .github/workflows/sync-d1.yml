name: Sync D-1

on:
  schedule:
    # 07:00 America/Sao_Paulo (UTC-3) = 10:00 UTC -- depois do sync-sem-corridas
    - cron: '0 10 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r robots/requirements.txt
          playwright install --with-deps chromium

      - name: Baixar relatório Performance de ontem e gravar no Supabase
        env:
          FRANQUEADO_EMAIL: ${{ secrets.FRANQUEADO_EMAIL }}
          FRANQUEADO_PASSWORD: ${{ secrets.FRANQUEADO_PASSWORD }}
          EMAIL_IMAP_PASSWORD: ${{ secrets.EMAIL_IMAP_PASSWORD }}
          EMAIL_IMAP_HOST: imap.titan.email
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m robots.d1_sync

      - name: Salvar screenshot de erro (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-d1-sync
          path: robots/debug_d1_sync.png
          if-no-files-found: ignore
