name: Sync D-1 (Performance)

on:
  schedule:
    # 07:00 America/Sao_Paulo (UTC-3) = 10:00 UTC -- depois do relatório de
    # ontem já estar fechado no franqueado. Minuto 7 (não 0) pra fugir do
    # horário cheio do GitHub Actions -- runs marcadas pra hora exata (:00)
    # competem com todo mundo e atrasam mais (aconteceu 06/08/2026, sumiu
    # o run do dia).
    - cron: '7 10 * * *'
    # Rede de segurança: se a run das 07:00 falhar (proxy instável, mesmo
    # problema recorrente), essas tentam de novo mais tarde. d1_sync já
    # confere sozinho se o dia já está no banco e não faz nada se já
    # estiver -- então rodar essas de graça todo dia não tem custo quando
    # está tudo ok. Pedido do usuário 08/08/2026 (dia 06 sumiu de novo).
    #
    # As duas primeiras (07:25 e 07:45) existem especificamente pra
    # garantir o dado pronto até as 08:00 -- pedido do usuário 10/08/2026
    # ("preciso que 8h esteja atualizado sem falta").
    - cron: '25 10 * * *'  # 07:25 BRT
    - cron: '45 10 * * *'  # 07:45 BRT
    - cron: '22 13 * * *'  # 10:22 BRT
    - cron: '37 16 * * *'  # 13:37 BRT
  workflow_dispatch:
    inputs:
      data_alvo:
        description: 'Data específica pra sincronizar (YYYY-MM-DD) -- deixe vazio pra "ontem" (padrão)'
        required: false
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r robots/requirements.txt
          playwright install --with-deps chromium

      - name: Sincronizar relatório Performance (D-1) no Supabase
        env:
          FRANQUEADO_EMAIL: ${{ secrets.FRANQUEADO_EMAIL }}
          FRANQUEADO_PASSWORD: ${{ secrets.FRANQUEADO_PASSWORD }}
          EMAIL_IMAP_PASSWORD: ${{ secrets.EMAIL_IMAP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Proxy -- franqueado.entregolog.com bloqueia IP de datacenter
          # (Akamai + PerimeterX), precisa sair por outro caminho. Ver
          # robots/browser_launch.py e o comentário sobre o proxy atual no
          # .env (stopgap gratuito do Webshare desde 21/08/2026, DataImpulse
          # ficou sem crédito).
          # e robots/franqueado_login.py.
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
          DATA_ALVO: ${{ inputs.data_alvo }}
        run: python -m robots.d1_sync

      - name: Salvar screenshot de erro (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-d1-sync
          path: robots/debug_d1_sync.png
          if-no-files-found: ignore
