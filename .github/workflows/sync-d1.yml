name: Sync D-1 (Performance)

on:
  schedule:
    # 07:00 America/Sao_Paulo (UTC-3) = 10:00 UTC -- depois do relatório de
    # ontem já estar fechado no franqueado. Minuto 7 (não 0) pra fugir do
    # horário cheio do GitHub Actions -- runs marcadas pra hora exata (:00)
    # competem com todo mundo e atrasam mais (aconteceu 06/08/2026, sumiu
    # o run do dia).
    - cron: '7 10 * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          pip install -r robots/requirements.txt
          playwright install --with-deps chromium

      - name: Sincronizar relatório Performance (D-1) no Supabase
        env:
          FRANQUEADO_EMAIL: ${{ secrets.FRANQUEADO_EMAIL }}
          FRANQUEADO_PASSWORD: ${{ secrets.FRANQUEADO_PASSWORD }}
          EMAIL_IMAP_PASSWORD: ${{ secrets.EMAIL_IMAP_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Proxy residencial (DataImpulse) -- franqueado.entregolog.com
          # bloqueia IP de datacenter (Akamai + PerimeterX), precisa sair
          # por IP residencial fixo (sticky) e geo Brasil. Ver robots/browser_launch.py
          # e robots/franqueado_login.py.
          PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
          PROXY_USERNAME: ${{ secrets.PROXY_USERNAME }}
          PROXY_PASSWORD: ${{ secrets.PROXY_PASSWORD }}
        run: python -m robots.d1_sync

      - name: Salvar screenshot de erro (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-d1-sync
          path: robots/debug_d1_sync.png
          if-no-files-found: ignore
